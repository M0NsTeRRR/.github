[project]
name = "git_automation"
version = "0.0.0"
description = "Github meta repository, contains automation/workflows/standard configs used across my repositories."
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
authors = [{ name = "Ludovic Ortega", email = "ludovic.ortega@adminafk.fr" }]
keywords = ["github", "pulumi"]
classifiers = [
  "License :: OSI Approved :: CEA CNRS Inria Logiciel Libre License, version 2.1 (CeCILL-2.1)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
]
dependencies = [
  "Jinja2~=3.1.6",
  "PyYAML~=6.0.3",
  "pulumi~=3.274.1",
  "pulumi-github~=6.15.0",
  "requests~=2.34.2",
]

[dependency-groups]
dev = ["ruff~=0.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/git_automation"]
